<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Easy English</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500&family=Noto+Sans+Khmer:wght@400;700&display=swap" rel="stylesheet">
<style>:root{--bg:#F8FAFC;--card:#fff;--tx:#0f172a;--mu:#64748b;--pr:#2563EB;--sc:#60A5FA;--ac:#FACC15;--bd:#e2e8f0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1220;--card:#131c31;--tx:#e8eefc;--mu:#94a3b8;--bd:#25324d}}
:root[data-theme="dark"]{--bg:#0b1220;--card:#131c31;--tx:#e8eefc;--mu:#94a3b8;--bd:#25324d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 Inter,"Noto Sans Khmer",system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:10}
h1,h2,h3,.btn,.logo{font-family:Poppins,"Noto Sans Khmer",sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:11;background:var(--card);border-bottom:1px solid var(--bd);padding:8px 4%;display:flex;align-items:center;gap:14px}
.logo{font-weight:700;font-size:20px;color:var(--pr);white-space:nowrap}.logo b{color:#ca8a04}
nav{display:flex;gap:4px;overflow-x:auto;flex:1}
nav a{color:var(--tx);text-decoration:none;font-weight:500;padding:6px 12px;border-radius:20px;white-space:nowrap;font-size:14px}
nav a.on{background:var(--pr);color:#fff}
.btn{background:var(--pr);color:#fff;border:0;border-radius:12px;padding:8px 18px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block;font-size:15px}
.btn.y{background:var(--ac);color:#1e293b}.btn.o{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
main{max-width:1050px;margin:0 auto;padding:22px 4% 40px}
.hero{background:linear-gradient(120deg,var(--pr),var(--sc));color:#fff;border-radius:24px;padding:36px 28px}
.hero h1{margin:0 0 6px;font-size:clamp(26px,5vw,42px)}.hero p{max-width:520px;margin:6px 0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin:16px 0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px}
a.card{color:var(--tx);text-decoration:none}a.card:hover{border-color:var(--pr)}
h2{color:var(--pr);margin:6px 0 4px}h3{margin:18px 0 6px}
.km{color:var(--mu)}.tag{background:var(--ac);color:#1e293b;border-radius:20px;padding:1px 10px;font-size:12px;font-weight:600}
.q{margin:12px 0}.q button,.opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 14px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit;cursor:pointer}
.q button.ok,.opt.ok{background:#16a34a;color:#fff}.q button.no,.opt.no{background:#dc2626;color:#fff}
details{border:1px solid var(--bd);border-radius:14px;padding:10px 14px;margin:8px 0;background:var(--card)}summary{cursor:pointer;font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bar{height:12px;background:var(--bd);border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pr)}
input,textarea,select{width:100%;padding:10px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit;margin:6px 0}
textarea{min-height:150px}
.pic{width:100%;height:auto;max-height:170px;object-fit:cover;border-radius:16px;display:block;margin:8px 0}

.hero2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:24px;align-items:center;margin-bottom:10px}
.hero2 h1{font-size:clamp(30px,5.5vw,52px);line-height:1.18;margin:0 0 14px;font-weight:700;letter-spacing:-.5px}
.hero2 p{color:var(--mu);font-size:17px;max-width:560px;margin:0 0 22px}
.btn.big{padding:16px 38px;border-radius:40px;font-size:17px}
.h2v{position:relative;background:linear-gradient(135deg,var(--card),var(--bg));border:1px solid var(--bd);border-radius:28px;height:430px;overflow:hidden;display:flex;justify-content:center;align-items:flex-end}
.phone{position:relative;width:230px;height:370px;background:var(--card);border:8px solid var(--pr);border-bottom:0;border-radius:38px 38px 0 0;padding:0 14px;box-shadow:0 20px 50px rgba(37,99,235,.25)}
.notch{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:80px;height:22px;background:#0f172a;border-radius:14px}
.avs{display:flex}.avs i{width:38px;height:38px;border-radius:50%;font-style:normal;display:grid;place-items:center;font-size:20px;margin-right:-6px;border:2px solid var(--card)}
.avs i.more{background:var(--bg);color:var(--mu);font-size:12px;font-weight:600;margin-left:10px}
.chat{margin-top:18px;display:grid;gap:8px}
.bub{background:var(--bg);border:1px solid var(--bd);border-radius:14px 14px 14px 4px;padding:7px 10px;font-size:12px;max-width:85%}
.bub.me{background:var(--pr);color:#fff;border-color:var(--pr);border-radius:14px 14px 4px 14px;justify-self:end}
.sk{height:9px;background:var(--bd);border-radius:6px}.sk.s{width:60%}
.fl{position:absolute;width:52px;height:52px;border-radius:16px;background:var(--card);border:1px solid var(--bd);box-shadow:0 8px 20px rgba(0,0,0,.1);display:grid;place-items:center;font-size:24px;animation:fl 4s ease-in-out infinite}
.f1{top:70px;right:8%}.f2{bottom:90px;left:8%;animation-delay:1.5s}
@keyframes fl{50%{transform:translateY(-8px)}}
@media (prefers-reduced-motion:reduce){.fl{animation:none}}
header .btn{padding:8px 18px;font-size:14px;white-space:nowrap}
.pill{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:20px;padding:6px 12px;font:600 14px Inter,"Noto Sans Khmer",sans-serif;cursor:pointer;white-space:nowrap}

#gate{position:fixed;inset:0;z-index:100;overflow:auto;background:radial-gradient(ellipse at top,#1e1b4b,#0b1020 60%);color:#e8eefc;display:flex;align-items:center;justify-content:center;padding:20px;box-sizing:border-box}
.gc{width:100%;max-width:440px;background:#0f1530;border:1px solid #2a3358;border-radius:32px;padding:24px 32px 28px;box-shadow:0 30px 80px rgba(0,0,0,.5);margin:auto}
.gtop{text-align:right}.gtop .pill{background:transparent;color:#e8eefc;border-color:#2a3358}
.glogo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:26px;justify-content:center;margin:6px 0 22px}
.glogo i{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#8b7cf6,#6d5fe0);display:grid;place-items:center;font-style:normal}
.eye{color:#a99cff;font-weight:700;font-size:12px;letter-spacing:.14em}
#gate h1{font-size:32px;margin:6px 0;line-height:1.25}.gs{color:#9aa6c8;margin:0 0 14px}
#gate label{display:block;font-weight:600;font-size:14px;margin:12px 0 6px}
#gate input{width:100%;box-sizing:border-box;background:#0b1020;border:1px solid #2a3358;border-radius:14px;padding:14px 16px;color:#e8eefc;font:inherit}
#gate input:focus{outline:2px solid #8b7cf6;border-color:transparent}
.gerr{color:#fda4af;font-size:14px;min-height:22px;margin-top:8px}
.gbtn{width:100%;padding:16px;border:0;border-radius:16px;background:linear-gradient(135deg,#8b7cf6,#6d5fe0);color:#fff;font-weight:700;font-size:16px;font-family:inherit;cursor:pointer}
.gq{text-align:center;color:#9aa6c8;margin:20px 0 14px}.gq a{color:#a99cff;font-weight:700;text-decoration:none}
.gins{width:100%;padding:14px;border-radius:14px;border:1px solid #2a3358;background:#0b1020;color:#e8eefc;font-weight:600;font-size:15px;font-family:inherit;cursor:pointer}
.gnote{text-align:center;color:#7d89ad;font-size:12px;margin:14px 0 0}
</style><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#2563EB"><link rel="apple-touch-icon" href="icons/icon-180.png"><meta name="apple-mobile-web-app-capable" content="yes"></head><body>

<h3>Categories</h3><div class="grid">${[["vocab","📚","Vocabulary","ពាក្យ"],["grammar","✏️","Grammar","វេយ្យាករណ៍"],["listen","🎧","Listening","ការស្តាប់"],["speak","🗣️","Speaking","ការនិយាយ"],["read","📖","Reading","ការអាន"],["write","📝","Writing","ការសរសេរ"],["levels","🪜","Levels","កម្រិត A1 · A2 · B1 · B2"],["units","🎓","Book Units","មេរៀន ១០ ជំពូក"],["quiz","🧠","Quiz","កម្រងសំណួរ"]].map(c=>`<a class="card" href="#${c[0]}"><span style="font-size:28px">${c[1]}</span><br><b>${c[2]}</b><br><span class="km">${c[3]}</span></a>`).join("")}</div>

grammar:()=>`<h2>✏️ Grammar · វេយ្យាករណ៍</h2>${img("page-grammar","Grammar")}<span class="tag">A1 Starter</span>
<details open><summary>Present Simple Tense</summary><p class="km">ប្រើសម្រាប់សកម្មភាពប្រចាំថ្ងៃ ឬទម្លាប់។</p><ul><li>I go to school.</li><li>She studies English.</li><li>They play football.</li></ul>${mq(PS)}</details>
<details><summary>Past Simple Tense</summary><p class="km">ប្រើសម្រាប់ហេតុការណ៍ដែលបានកើតឡើងរួចហើយ។</p><p>I visited Siem Reap last year.</p></details>
<details><summary>Future Simple Tense</summary><p class="km">ប្រើ will + កិរិយាសព្ទ សម្រាប់អនាគត។</p><p>We will travel tomorrow.</p></details>
<details><summary>Parts of Speech</summary><p>Noun · នាម | Verb · កិរិយាសព្ទ | Adjective · គុណនាម | Adverb · កិរិយាវិសេសន៍ | Pronoun · សព្វនាម | Preposition · បុព្វបទ | Conjunction · ឈ្នាប់</p></details>
<h3>Book grammar points (30)</h3>`+U.map((u,i)=>u[3].map(l=>`<details><summary>${l[2]} <span class="km">· Unit ${i+1}</span></summary><p>${l[3]}</p><p><i>${l[4]}</i> ${sp(l[4])}</p></details>`).join("")).join(""),

listen:()=>`<h2>🎧 Listening · ការស្តាប់</h2>${img("page-listen","Listening")}`+LD.map((d,i)=>`<div class="card" style="margin:10px 0"><b>Dialogue ${i+1}</b> <button class="btn" data-dlg="${i}">▶ Play</button><details><summary>Transcript</summary>${d[0].map((l,k)=>`<p><b>${k%2?"B":"A"}:</b> ${l}</p>`).join("")}</details>${mq(d[1])}</div>`).join(""),

write:()=>{const o=U.map((u,i)=>`<option value="${i}">Unit ${i+1}: ${u[5]}</option>`).join("");return `<h2>📝 Writing · ការសរសេរ</h2>${img("page-write","Writing")}<select id="wsel">${o}</select><textarea id="wta" placeholder="Write here… សរសេរនៅទីនេះ"></textarea><div class="row"><button class="btn" data-ws="1">💾 Save</button><span id="wc" class="km"></span></div>`},

const q=QZ.l[QZ.i];return `<h2>🧠 Quiz · Question ${QZ.i+1}/${QZ.l.length}</h2><div class="card"><b>${q[0]}</b>${q[1].map((o,j)=>`<button class="opt" data-qa="${j}">${o}</button>`).join("")}<p id="qf"></p><button class="btn hide" id="qn" style="display:none" data-qn="1">Next →</button></div>`},

<button class="btn" data-li="1">Create account / Log in</button>`}<p class="km" style="font-size:13px">Demo account saved only in this browser. Real accounts need a PHP + MySQL backend.</p></div>`
};
const NAV=[["home","Home"],["levels","Levels"],["units","Units"],["vocab","Vocabulary"],["grammar","Grammar"],["listen","Listening"],["speak","Speaking"],["read","Reading"],["write","Writing"],["quiz","Quiz"],["dash","Dashboard"],["login","Account"]];
function render(){const p=(location.hash.slice(1)||"home");const pg=P[p]?p:"home";
$("nav").innerHTML=NAV.map(n=>`<a href="#${n[0]}" class="${n[0]==pg?"on":""}">${n[1]}</a>`).join("");
$("app").innerHTML=P[pg]();window.scrollTo(0,0);
if(pg=="write")loadW();applyLang();gate()}
function loadW(){$("wta").value=st.txt[$("wsel").value]||"";$("wc").textContent=""}
addEventListener("hashchange",()=>{QZ=null;render()});

/* ===== EVENTS ===== */
let rec,ch=[];
$("app").onclick=async e=>{const t=e.target.closest("button,[data-say]");if(!t)return;const d=t.dataset;
if(d.say){say(d.say);return}
if(d.c!==undefined){const q=t.parentNode;if(q.dataset.d)return;const ok=d.c==="1";t.classList.add(ok?"ok":"no");q.querySelector("span").textContent=ok?"✅ ត្រឹមត្រូវ / Correct!":"❌ ព្យាយាមម្តងទៀត / Try again";if(ok){q.dataset.d=1;if(q.dataset.ch&&!st.days.includes(D)){st.days.push(D);save()}}return}
if(d.fav){st.fav=st.fav.includes(d.fav)?st.fav.filter(x=>x!=d.fav):[...st.fav,d.fav];save();t.textContent=st.fav.includes(d.fav)?"⭐":"☆";return}
if(d.done){st.done[d.done]?delete st.done[d.done]:st.done[d.done]=1;save();render();return}
if(d.lv!==undefined){lv=+d.lv;render();return}
if(d.vl){vi=+d.vl;render();return}
if(d.dlg){speechSynthesis.cancel();LD[d.dlg][0].forEach((l,i)=>{const u=new SpeechSynthesisUtterance(l);u.lang="en-US";u.pitch=i%2?1.4:.8;u.rate=.85;speechSynthesis.speak(u)});return}
if(d.ws){const k=$("wsel").value;if($("wta").value.trim()){st.txt[k]=$("wta").value;save();$("wc").textContent="💾 Saved · រក្សាទុករួច"}return}
if(d.qa!==undefined){if(QZ.a)return;QZ.a=true;const q=QZ.l[QZ.i],ok=+d.qa===q[2];if(ok)QZ.s++;document.querySelectorAll(".opt").forEach((b,j)=>{if(j==q[2])b.classList.add("ok");else if(b==t)b.classList.add("no")});$("qf").textContent=ok?"✅ Correct!":"❌ Correct answer: "+q[1][q[2]];$("qn").style.display="inline-block";return}
if(d.qn){QZ.i++;QZ.a=false;render();return}
if(d.qr){QZ=null;render();return}
if(d.li){const n=$("un").value.trim(),m=$("ue").value.trim();if(n&&m){st.user={name:n,email:m};save();render()}return}
if(d.lo){st.user=null;save();render();return}
if(t.id=="rb"){if(rec&&rec.state=="recording"){rec.stop();return}
try{const s=await navigator.mediaDevices.getUserMedia({audio:true});rec=new MediaRecorder(s);ch=[];rec.ondataavailable=x=>ch.push(x.data);
rec.onstop=()=>{s.getTracks().forEach(k=>k.stop());const a=$("ra");a.src=URL.createObjectURL(new Blob(ch));a.style.display="block";t.textContent="● Record"};
rec.start();t.textContent="■ Stop"}catch(x){$("rm").textContent="Microphone not available here · មិនអាចប្រើមីក្រូហ្វូន"}}};
$("app").onchange=e=>{if(e.target.id=="wsel")loadW()};
$("th").onclick=()=>{st.theme=dark()?"light":"dark";save();applyLang()};
$("lg").onclick=()=>{st.lang=st.lang=="km"?"en":"km";save();render()};
render();</script><script>if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js"))</script></body></html>
